<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveControl Web Panel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                </div>
                <div>
                    <h1>LiveControl</h1>
                    <p>Gelişmiş Cihaz Yönetim Paneli</p>
                </div>
            </div>
        </div>
    </header>
    
    <main>
        <div id="devices-container" class="devices-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Cihazlar senkronize ediliyor...</p>
            </div>
        </div>
    </main>

    <!-- Bildirim Modalı -->
    <div id="notifications-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="display: flex; align-items: center; gap: 8px;">
                    <svg class="ui-icon" style="color: var(--primary);" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    Cihaz Bildirimleri
                </h2>
                <button class="close-btn" onclick="closeNotifications()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="modal-filters" id="modal-filters">
                <!-- Butonlar JS ile dinamik gelecek -->
            </div>

            <div class="modal-body" id="modal-notifications-list">
                <p class="text-muted">Bildirimler yükleniyor...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
