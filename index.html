<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveControl Web Panel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <div>
                    <h1>LiveControl</h1>
                    <p>Gelişmiş Cihaz Yönetim Paneli</p>
                </div>
            </div>
        </div>
    </header>
    
    <main>
        <div id="devices-container" class="devices-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Cihazlar senkronize ediliyor...</p>
            </div>
        </div>
    </main>

    <!-- Bildirim Modalı -->
    <div id="notifications-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔔 Cihaz Bildirimleri</h2>
                <button class="close-btn" onclick="closeNotifications()">✕</button>
            </div>
            
            <!-- Yatay Kaydırılabilir Filtre Çubuğu -->
            <div class="modal-filters" id="modal-filters">
                <!-- Butonlar JS ile dinamik gelecek -->
            </div>

            <div class="modal-body" id="modal-notifications-list">
                <p class="text-muted">Bildirimler yükleniyor...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
